<!--
  Wazuh Agent Configuration — KShield Homelab
  Applied to: Windows 10 domain-joined endpoint
  Manager: wazuh.mywire.org
-->

<ossec_config>

  <!-- Manager connection -->
  <client>
    <server>
      <address>wazuh.mywire.org</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- Standard Windows Event Logs -->
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <!-- Key AD event IDs: 4624, 4625, 4648, 4720, 4728, 4768, 4769 -->
  </localfile>

  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon Event Channel — critical for endpoint telemetry -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Script Block Logging -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- File integrity monitoring — sensitive directories -->
  <syscheck>
    <frequency>43200</frequency>
    <directories check_all="yes" report_changes="yes">C:\Users</directories>
    <directories check_all="yes">C:\Windows\System32</directories>
    <ignore>C:\Windows\System32\LogFiles</ignore>
    <ignore type="sregex">.log$|.tmp$</ignore>
  </syscheck>

</ossec_config>
